name: PR Auto Labels

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    name: Detect and apply PR labels
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect change signals
        id: signals
        shell: bash
        run: |
          set -uo pipefail

          BASE_REF="${{ github.base_ref }}"

          # The base branch must exist locally; with fetch-depth: 0 it always
          # comes in, but guard anyway so labeling never hard-fails.
          if ! git rev-parse --verify --quiet "origin/$BASE_REF" > /dev/null; then
            git fetch origin "$BASE_REF" || true
          fi

          FILES="$(git diff --name-only "origin/$BASE_REF...HEAD" 2> /dev/null || true)"
          TYPES="$(git log "origin/$BASE_REF..HEAD" --pretty=format:'%s' 2> /dev/null |
            sed -nE 's/^([a-zA-Z]+)(\([^)]*\))?!?:.*/\1/p' |
            tr '[:upper:]' '[:lower:]' |
            sort -u |
            paste -sd ' ' - || true)"

          {
            echo "files<<EOF"
            printf '%s\n' "${FILES:-(none)}"
            echo "EOF"

            echo "types<<EOF"
            printf '%s\n' "${TYPES:-chore}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Apply labels
        uses: actions/github-script@v7
        env:
          FILES: ${{ steps.signals.outputs.files }}
          TYPES: ${{ steps.signals.outputs.types }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;

            if (!pr) {
              throw new Error("Pull request context is unavailable.");
            }

            const files = (process.env.FILES || "").split("\n").filter(Boolean);
            const types = (process.env.TYPES || "").split(" ").filter(Boolean);

            const LABELS = {
              typescript: "typescript",
              storybook: "storybook",
              documentation: "documentation",
              actions: "github-actions",
              styles: "styles",
              tests: "tests",
              feature: "feature",
              fix: "fix",
              chore: "chore",
              refactor: "refactor",
            };

            const has = (glob) =>
              files.some((file) => new RegExp(glob).test(file));

            const wanted = new Set();

            // Content area: what is touched.
            if (has("\\.(ts|tsx)$") && !has("^stories/")) {
              wanted.add(LABELS.typescript);
            }
            if (has("(^|/)\\.storybook/|^stories/.*\\.stories\\.(ts|tsx)$")) {
              wanted.add(LABELS.storybook);
            }
            if (has("\\.(md|mdx)$|(^|/)LICENSE$")) {
              wanted.add(LABELS.documentation);
            }
            if (has("(^|/)\\.github/")) {
              wanted.add(LABELS.actions);
            }
            if (has("\\.(css|scss)($|\\.)|tailwind")) {
              wanted.add(LABELS.styles);
            }
            if (has("(\\.test\\.(ts|tsx)$|\\.spec\\.(ts|tsx)$|(^|/)test/)")) {
              wanted.add(LABELS.tests);
            }

            // Intent: conventional commit types in the PR.
            for (const type of types) {
              if (type === "feat" || type === "feature") {
                wanted.add(LABELS.feature);
              } else if (type === "fix" || type === "bugfix") {
                wanted.add(LABELS.fix);
              } else if (type === "docs") {
                wanted.add(LABELS.documentation);
                wanted.delete(LABELS.typescript);
              } else if (type === "chore" || type === "ci") {
                wanted.add(LABELS.chore);
              } else if (type === "refactor") {
                wanted.add(LABELS.refactor);
              } else if (type === "test") {
                wanted.add(LABELS.tests);
                wanted.add(LABELS.typescript);
              } else if (type === "style") {
                wanted.add(LABELS.styles);
              }
            }

            if (types.length === 0) {
              wanted.add(LABELS.chore);
            }

            // List current labels and create any wanted one that does not
            // exist yet, so the PR is always labeled even on fresh repos.
            const existing = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );
            const existingNames = new Set(existing.map((l) => l.name));

            const LABEL_COLORS = {
              typescript: "3178c6",
              storybook: "ff4785",
              documentation: "0075ca",
              "github-actions": "2088ff",
              styles: "5319e7",
              tests: "0e8a16",
              feature: "a2eeef",
              fix: "d93f0b",
              chore: "c5def5",
              refactor: "fbca04",
            };

            const LABEL_DESCRIPTIONS = {
              typescript: "Cambios en TypeScript",
              storybook: "Cambios en Storybook / historias",
              documentation: "Cambios en documentacion",
              "github-actions": "Cambios en GitHub Actions / CI",
              styles: "Cambios de estilos CSS / Tailwind",
              tests: "Cambios en pruebas unitarias",
              feature: "Nueva funcionalidad (feat)",
              fix: "Correccion de errores (fix)",
              chore: "Mantenimiento y CI (chore/ci)",
              refactor: "Refactorizacion sin cambio de comportamiento",
            };

            // Create any wanted label that does not exist yet so the PR is
            // always labeled, even on fresh repositories.
            for (const name of wanted) {
              if (!existingNames.has(name)) {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color: LABEL_COLORS[name] ?? "ededed",
                    description: LABEL_DESCRIPTIONS[name],
                  });
                  existingNames.add(name);
                } catch (error) {
                  if (error.status === 422) {
                    // Created concurrently by another run; treat as existing.
                    existingNames.add(name);
                  } else {
                    throw error;
                  }
                }
              }
            }

            // Keep labels a human added manually.
            const manual = pr.labels
              .map((l) => l.name)
              .filter((name) => !Object.values(LABELS).includes(name));

            const toApply = [...wanted].filter((name) =>
              existingNames.has(name),
            );

            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: [...new Set([...manual, ...toApply])],
            });

            core.info(`Applied labels: ${[...manual, ...toApply].join(", ")}`);
